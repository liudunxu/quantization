[project]
name = "stock-trading-ml"
version = "1.0.0"
description = "基于机器学习的股票交易决策系统，支持A股、港股、美股"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    # Core ML
    "catboost>=1.2.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    
    # Data sources
    "akshare>=1.12.0",
    "yfinance>=0.2.0",
    "baostock>=0.8.8",
    
    # Feature engineering
    "ta-lib>=0.4.28",
    "statsmodels>=0.14.0",
    
    # Cache
    "joblib>=1.3.0",
    
    # Backtesting
    "backtrader>=1.9.78",
    
    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openbb = ["openbb>=4.0.0"]
sentiment = ["snownlp>=0.12.3"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
decide = "scripts.decide:main"
backtest = "scripts.backtest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
per-file-ignores = {"scripts/*" = ["E402"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
